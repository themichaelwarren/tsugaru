    <script>
        // First we get the viewport height and we multiple it by 1% to get a value for a vh unit
        let vh = window.innerHeight * 0.01;
        // Then we set the value in the --vh custom property to the root of the document
        document.documentElement.style.setProperty('--vh', `${vh}px`);

        // We listen to the resize event
        window.addEventListener('resize', () => {
        // We execute the same script as before
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        });
    </script>
</head>

<script>
  function triggerAudioAndFlip(element, audioId, backText) {
    const flipBoxInner = element.querySelector('.flip-box-inner');
    const backContent = element.querySelector('.flip-box-back .content');
    const audio = document.getElementById(audioId);

    // Set the back text
    backContent.textContent = backText;

    // Play the audio
    audio.play();

    // Flip the card
    element.classList.add('flipped');

    // Flip back after 2 seconds
    setTimeout(() => {
      element.classList.remove('flipped');
    }, 2000);
  }
</script>
