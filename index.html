<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
    <title>津軽弁ドットコム</title>
    <style>
        body {
            background-color: white;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-weight: 900;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Stack items vertically */
            height: 100vh; /* Full viewport height */
        }

        .center-div {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px; /* Space between image and button */
        }

        img {
            max-width: 100%;
            height: auto;
        }

        #buttonContainer {
            text-align: center;
        }

        #quoteButton {
            display: inline-block;
            background-color: #47a7f5;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #quoteButton:hover {
            background-color: #0066cc;
        }

        p {
            margin: 0;
        }

        a img {
            max-width: 100px;
        }
    </style>
</head>

<body>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

    <!-- Centered Image -->
    <div class="center-div">
        <img draggable="false" src="images/konniduha.png" alt="Centered Image">
    </div>

    <!-- Button and Counter -->
    <div id="buttonContainer">
        <a href="#" id="quoteButton">押さなが！</a>
        <p>
            <!-- Start of CuterCounter Code -->
            <a href="https://www.cutercounter.com/" target="_blank">
                <img src="https://www.cutercounter.com/hits.php?id=humxqxocp&nd=6&style=22" border="0" alt="best free website hit counter">
            </a>
            <!-- End of CuterCounter Code -->
        </p>
    </div>

</body>

</html>
