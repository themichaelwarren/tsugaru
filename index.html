<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
    <title>津軽弁ドットコム</title>
    <meta property="og:title" content="津軽弁ドットコム">
    <meta property="og:description" content="津軽弁ドットコム！">
    <meta property="og:image" content="https://tsugaruben.com/images/konniduha.png">
    <meta property="og:url" content="https://tsugaruben.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:site_name" content="津軽弁ドットコム">
    <meta name="twitter:image:alt" content="こんにづは！">
    <script>
        // Get viewport height and set custom --vh property
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);

        window.addEventListener('resize', () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        });
    </script>
    <style>
        body {
            background-color: white;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-weight: 900;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;  /* Center vertically */
            align-items: center;      /* Center horizontally */
            height: 100vh;            /* Full viewport height */
        }

        .center-div {
            display: flex;
            flex-direction: column; /* Stack image, button, and counter vertically */
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 80%; /* Adjust as needed */
            min-height: 200px;  /* Ensure the container has enough height */
        }

        img {
            max-width: 100%;
            height: auto;
        }

        #buttonContainer {
            text-align: center;
            margin-top: 20px; /* Space between button and counter */
        }

        #quoteButton {
            display: inline-block;
            background-color: #47a7f5;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #quoteButton:hover {
            background-color: #0066cc;
        }

        p {
            margin: 0;
        }

        a img {
            max-width: 100px;
        }
    </style>
</head>

<body>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

    <!-- Centered Image, Button, and Counter -->
    <div class="center-div">
        <img draggable="false" src="images/konniduha.png" alt="Centered Image">
        <!-- Button and Counter -->
        <div id="buttonContainer">
            <a href="#" id="quoteButton">押さなが！</a>
            <p>
                <!-- Start of CuterCounter Code -->
                <a href="https://www.cutercounter.com/" target="_blank">
                    <img src="https://www.cutercounter.com/hits.php?id=humxqxocp&nd=6&style=22" border="0" alt="best free website hit counter">
                </a>
                <!-- End of CuterCounter Code -->
            </p>
        </div>
    </div>

</body>

</html>
