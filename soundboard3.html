<!doctype html>
<html lang="en">
<head>
    <title>津軽弁サウンドボード</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link href="css/soundboard2.css" rel="stylesheet" type="text/css" />
</head>
<body>

<div class="square-container" id="square-container">
  <!-- Squares will be dynamically inserted here -->
</div>

<script>
  // Fetch the data from the JSON file
  fetch('data.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('square-container');
      data.squares.forEach((square, index) => {
        // Create the button element with the flip and audio functionality
        const button = document.createElement('button');
        button.className = `square ripple ${square.colorClass}`;
        button.setAttribute('onclick', `triggerAudioAndFlip(this, 'sound${index + 1}', '${square.textBack}')`);

        // Create the inner structure for flip effect
        const inner = `
          <div class="flip-box-inner">
            <div class="flip-box-front">
              <div class="content">${square.textFront}</div>
            </div>
            <div class="flip-box-back">
              <div class="content">${square.textBack}</div>
            </div>
          </div>
          <audio preload="auto" id="sound${index + 1}">
            <source src="${square.audio}" type="audio/mpeg">
          </audio>
        `;
        button.innerHTML = inner;

        // Append the button to the container
        container.appendChild(button);
      });
    });

  function triggerAudioAndFlip(element, audioId, backText) {
    const flipBoxInner = element.querySelector('.flip-box-inner');
    const backContent = element.querySelector('.flip-box-back .content');
    const audio = document.getElementById(audioId);

    // Set the back text
    backContent.textContent = backText;

    // Play the audio
    audio.play();

    // Flip the card
    element.classList.add('flipped');

    // Flip back after 2 seconds
    setTimeout(() => {
      element.classList.remove('flipped');
    }, 2000);
  }
</script>

</body>
</html>
